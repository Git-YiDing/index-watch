name: Collect public reference data and publish
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # UTC 00:17 / 06:17 = Asia/Shanghai 08:17 / 14:17.
    - cron: '17 0,6 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: index-watch-pages
  cancel-in-progress: false
jobs:
  collect-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Python in the tmp environment
        uses: conda-incubator/setup-miniconda@v4
        with:
          python-version: '3.12'
          activate-environment: tmp
          auto-update-conda: false
          channels: conda-forge
          conda-remove-defaults: true
      - name: Install collector dependencies
        run: conda run -n tmp python -m pip install --no-user -r requirements.txt
      - name: Test parsers and validation
        run: conda run -n tmp python -m unittest discover -s tests -v
      - name: Collect (failures are recorded, not hidden)
        env:
          SCHEDULE_ENABLED: 'true'
          ALIPAY_FEED_URL: ${{ secrets.ALIPAY_FEED_URL }}
        run: conda run -n tmp python scripts/update.py
      - name: Update dated returns and rolling DCA
        run: conda run -n tmp python scripts/update_returns.py
      - name: Validate the data and build
        run: |
          conda run -n tmp python scripts/validate.py
          conda run -n tmp python scripts/build.py
      - name: Preserve source observations and history
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/data/ site/index.html evidence/latest.json
          if ! git diff --cached --quiet; then
            git commit -m "每日数据更新 $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M') [skip ci]"
            git push
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload public site only
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Alert on incomplete collection after publishing truthful health
        run: conda run -n tmp python scripts/validate.py --health
